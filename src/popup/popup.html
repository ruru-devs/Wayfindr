<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
    }
    .title {
      font-weight: 800;
      font-size: 16px;
      color: #38bdf8;
    }
    .status-box {
      margin-top: 14px;
      background: #1e293b;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
    }
    .key-hint {
      margin-top: 14px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }
    .kbd {
      background: #334155;
      color: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .btn {
      margin-top: 12px;
      width: 100%;
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">Wayfindr</span>
    <span style="font-size: 11px; color: #94a3b8;">Intent Browser</span>
  </div>

  <div class="status-box">
    <div id="domain">Detecting site...</div>
    <div id="pageCount" style="color: #38bdf8; margin-top: 4px; font-weight: 600;">Ready</div>
  </div>

  <div class="key-hint">
    Press <span class="kbd">Alt+K</span> or <span class="kbd">Ctrl+K</span> to navigate
  </div>

  <button id="openPaletteBtn" class="btn" style="background: #2563eb; margin-top: 10px;">🔍 Open Search Bar</button>
  <button id="reindexBtn" class="btn" style="background: #334155; margin-top: 6px;">⚡ Force Re-index Site</button>

  <script src="popup.js"></script>
</body>
</html>
